# Merge into main => tests, Docker image to ghcr.io/agentlinkprotocol/console (:latest, :vX.Y.Z),
# GitHub release. If the repository is also connected to Vercel, Vercel deploys main on its own.
name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  packages: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm run lint && npm run build
  docker:
    name: docker image (ghcr.io)
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:v${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          git rev-parse "$TAG" >/dev/null 2>&1 || { git tag "$TAG" && git push origin "$TAG"; }
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Atlas Console $TAG" --generate-notes
          git tag -f latest && git push -f origin latest
